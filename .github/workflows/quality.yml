name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js and pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@22
          working-directory: frontend
          cache: true
          require-lockfile: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/uv.lock

      - name: Install pinned Python package tools
        run: python -m pip install --disable-pip-version-check "pip==26.2.1" "uv==0.12.19"

      - name: Verify Python dependency lock
        run: uv lock --check
        working-directory: backend

      - name: Install Python dependencies
        run: uv sync --locked --no-install-project
        working-directory: backend

      - name: Audit production JavaScript dependencies
        run: pnpm audit --prod
        working-directory: frontend

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          uv export --locked --no-install-project --format requirements.txt --output-file "$RUNNER_TEMP/tsrp-python-requirements.txt"
          pip-audit -r "$RUNNER_TEMP/tsrp-python-requirements.txt"
        working-directory: backend

      - name: Lint
        run: pnpm lint
        working-directory: frontend

      - name: Type-check
        run: pnpm typecheck
        working-directory: frontend

      - name: Test Python analysis and API
        run: backend/.venv/bin/python -W error::DeprecationWarning -m unittest -q
        env:
          PYTHONPATH: backend

      - name: Test TypeScript utilities
        run: pnpm test:node
        working-directory: frontend

      - name: Build production app
        run: pnpm build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Smoke-test rendered production routes
        run: pnpm test:production-smoke
        working-directory: frontend

name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js and pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@22
          cache: true
          require-lockfile: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test Python analysis and API
        run: pnpm test:python

      - name: Test TypeScript utilities
        run: pnpm test:node

      - name: Build production app
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

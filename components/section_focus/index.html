<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TSRP section focus</title>
    <style>
      html, body { width: 1px; height: 1px; margin: 0; padding: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <script>
      (() => {
        let cancelled = false;

        const isAttached = () => {
          try {
            return Boolean(window.frameElement && window.parent.document.contains(window.frameElement));
          } catch (_error) {
            return false;
          }
        };

        const focusSection = () => {
          if (cancelled) return;
          try {
            const target = window.parent.document.querySelector(".research-section-anchor");
            if (!target) return;
            target.scrollIntoView({ behavior: "smooth", block: "start" });
            target.focus({ preventScroll: true });
          } catch (_error) {
            // The parent document can be unavailable while Streamlit is rerendering.
          }
        };

        const cancel = () => { cancelled = true; };
        window.addEventListener("pagehide", cancel, { once: true });
        window.addEventListener("unload", cancel, { once: true });

        window.setTimeout(() => {
          window.requestAnimationFrame(() => {
            window.requestAnimationFrame(focusSection);
          });
        }, 60);

        if (isAttached()) {
          window.parent.postMessage(
            { isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 },
            "*",
          );
          window.parent.postMessage(
            { isStreamlitMessage: true, type: "streamlit:setFrameHeight", height: 1 },
            "*",
          );
        }
      })();
    </script>
  </body>
</html>
